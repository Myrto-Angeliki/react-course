<!DOCTYPE html>
<html>
    <head>
        <title>React Basics</title>
        <style>
            .app-container{
                margin-left: 600px;
                margin-top: 200px;
            }

            .input-field{
                padding: 12px 15px;
                border-radius: 10px;
                border-width: 1px;
                font-size: 15px;

                display: flex;
                max-width: 100px;
            }

            .input-style{
                padding: 12px 15px;
                border-radius: 10px;
                border-width: 1px;
                font-size: 15px;

                flex-grow: 1;
            }

            .show-button{
                margin-left: 15px;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <div class="js-container"></div>

        <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script type="text/babel">
            
            function App(){
                const [showPassword, setShowPassword] = React.useState(false);
                // const showPasswordRef = React.useRef(null);

                // React.useEffect(() => {
                //     const inputElem = showPasswordRef.current;
                //     if(inputElem){
                //         inputElem.type = showPassword ? "text" : "password";
                //     }
                // }, [showPassword]);

                return (
                    <div className="app-container">
                        <h2> Hello, welcome to my website</h2>
                        <div className="input-field">
                            <input 
                                placeholder="Email"
                                className="input-style"
                                type="email"
                            />
                        </div>
                        <div className="input-field">
                            <input 
                                placeholder="Password"
                                className="input-style"
                                type={showPassword ? 'text' : 'password'}
                                //ref={showPasswordRef}

                            />
                            <button onClick={() => {
                                showPassword
                                    ? setShowPassword(false)
                                    : setShowPassword(true);
                                }}
                                className="show-button"
                            >
                                {(showPassword)
                                    ? 'Hide'
                                    : 'Show'}
                            </button>
                        </div>

                    </div>
                );
            }

            const container = document.querySelector('.js-container');
            ReactDOM.createRoot(container).render(<App />);
        </script>
    </body>
</html>
