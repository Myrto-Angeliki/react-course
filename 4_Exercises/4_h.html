<!DOCTYPE html>
<html>
    <head>
        <title>React Basics</title>
    </head>
    <body>
        <div class="js-container"></div>

        <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script type="text/babel">


            function ResetCount({setCount}){
                function handleReset(){
                    setCount(0);
                }

                return (
                   <>
                        <button onClick={handleReset}>
                            Reset
                        </button>
                    </> 
                );
            }

            function AutoClick({buttonRef}){
                const [isAutoClick, setIsAutoClick] = React.useState(false);
                let timerId = 0;


                React.useEffect(() => {
                    const buttonElem = buttonRef.current;
                    if(buttonElem && isAutoClick){

                        timerId = setInterval(() => {buttonElem.click()}, 1000);
                    }
                }, [isAutoClick]);

                return (
                    <>
                        <button 
                            onClick={() => {
                                setIsAutoClick(!isAutoClick)
                            }}
                        >
                            Auto Click
                        </button>
                    </>
                );
            }
            
            function ButtonClickCount({count, setCount}){
                const [isAutoClick, setIsAutoClick] = React.useState(false);
                const buttonRef = React.useRef(null);

                function handleClick(){
                    setCount((count + 1));
                }

                return (
                    <>
                        <button 
                            onClick={handleClick}
                            ref={buttonRef}
                        >
                            Clicked {count} {count != 1 ? 'times' : 'time'}
                        </button>
                        <ResetCount 
                            setCount = {setCount}
                        />
                        <AutoClick 
                            buttonRef = {buttonRef}
                        />

                    </>
                );
            }
            

            function App(){
                const [count, setCount] = React.useState(0);

                return (
                    <>
                        <ButtonClickCount 
                            count = {count}
                            setCount = {setCount}
                        />
                    </>
                );
            }

            const container = document.querySelector('.js-container');
            ReactDOM.createRoot(container).render(<App />);
        </script>
    </body>
</html>
